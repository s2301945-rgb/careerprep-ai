name: Deployment Smoke

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production:
    name: Production health and API boundary
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      endsWith(github.event.deployment.environment, ' / production')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://careerprep-ai-ten.vercel.app' }}
      SMOKE_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://careerprep-ai-production.up.railway.app' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check frontend, database read and protected API
        run: node scripts/smoke.mjs
